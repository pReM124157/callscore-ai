<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Report | CallScore AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-report">
  <main class="page-shell">
    <section class="hero hero-report">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>Executive Review</span>
      </div>

      <div class="hero-grid hero-grid-report">
        <div class="hero-copy">
          <p class="hero-kicker">AI Sales Performance Analysis</p>
          <h1 class="hero-title">
            <span class="hero-title-line">Sales Call</span>
            <span class="hero-title-line">Evaluation</span>
          </h1>
          <p class="hero-description">
            A structured review of call quality, coaching opportunities, buying signals,
            and the next action your team should take.
          </p>
        </div>
      </div>
    </section>

    <section id="report" class="report-grid"></section>

    <a class="back-link" href="/">Score another call</a>
  </main>

  <script src="report.js"></script>
</body>
</html>
